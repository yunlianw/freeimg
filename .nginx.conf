# FreeImg Nginx 配置（精简版）
# 粘贴到宝塔 → 网站 → 你的域名 → 配置文件（server { } 内）

# === 伪静态 ===
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# === 拒绝访问敏感目录 ===
# 注意：install/ 不 deny！用户必须能访问安装向导
# 安装完成后请手动 rm -rf /www/wwwroot/freeimg/install/
location ~ ^/(config|database|app|views|assets-src|storage|public/storage)/ {
    deny all;
    return 403;
}

location ~ \.(lock|sql|md|env|gitignore|bak|backup|log)$ {
    deny all;
    return 403;
}

# === 上传图片直读（不走 PHP）===
# 同时支持 /img/xxx 和 /uploads/xxx 两种 URL（兼容老链接）
location ~ ^/(img|uploads)/ {
    alias /www/wwwroot/freeimg/storage/images/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

# === PHP 上传大小 ===
client_max_body_size 20M;

# === 隐藏 PHP 版本 ===
fastcgi_hide_header X-Powered-By;