# FreeImg Nginx 配置（精简版 + 通用）
# 粘贴到宝塔 → 网站 → 你的域名 → 配置文件（server { } 内）
#
# 设计原则（v1.3.4）：
# - path=public（默认）：图片物理在 public/img/，nginx root 直接 serve，零额外配置
# - path=storage/images：需在 public/ 下建软链 public/img → ../storage/images/img，
#   try_files $uri 自动跟随符号链接命中（nginx 默认行为）
# - 不要使用 alias 指向 storage 路径：alias 里的路径是写死的，换项目就 404
#
# 文档：README.md「伪静态规则」章节

# === 伪静态（通用，无需按 storage path 调整）===
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# === 拒绝访问敏感目录 ===
# 注意：install/ 不 deny！用户必须能访问安装向导
# 安装完成后请手动 rm -rf /www/wwwroot/freeimg/install/
location ~ ^/(config|database|app|views|assets-src|storage|public/storage)/ {
    deny all;
    return 403;
}

location ~ \.(lock|sql|md|env|gitignore|bak|backup|log)$ {
    deny all;
    return 403;
}

# === 静态资源缓存（图片/字体/css/js/svg 30 天）===
location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|svg|woff|woff2)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
}

# === PHP 上传大小 ===
client_max_body_size 20M;

# === 隐藏 PHP 版本 ===
fastcgi_hide_header X-Powered-By;
